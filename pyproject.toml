[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-delay-forecaster"
version = "0.1.0"
description = "Flight delay forecasting with an LLM explanation layer"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.ruff.lint]
# E701: the aligned one-line dispatch returns in _hour_phrase, _prob_text and
# list_flights read as lookup tables. keeping them on one line is intentional.
ignore = ["E701"]